<style>

x}.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.page{display:none}.page.active{display:block}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 2px 9px}.section-title h2{font-size:18px;margin:0}.subnav{display:flex;overflow:auto;gap:6px;margin:0 0 12px;padding-bottom:2px}.subnav button{flex:0 0 auto}.nav{position:fixed;z-index:21;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center;gap:2px;padding:7px max(6px,calc((100% - 760px)/2));padding-bottom:calc(7px + env(safe-area-inset-bottom))}.nav button{background:transparent;border:0;color:#8c8374;border-radius:9px;padding:8px 7px;font-size:11px;flex:1;max-width:100px}.nav button.active{background:#fff7df;color:var(--gold-dark);font-weight:800}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat-box{background:var(--cream);border:1px solid var(--line);padding:9px;border-radius:9px}.stat-box b{display:block;font-size:18px;color:var(--gold-dark);margin-top:2px}.progress{height:7px;border-radius:99px;background:#eee9de;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#d7b35d,#e96b8d);border-radius:99px}.skill-row{display:grid;grid-template-columns:58px 1fr 34px;gap:7px;align-items:center;font-size:12px;margin:7px 0}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#f1ead9;color:#796021;border:1px solid #e2d3a8;margin:2px}.badge.pink{background:#fff0f5;color:#a83259;border-color:#edb4c5}.badge.blue{background:#eaf2ff;color:#28578e;border-color:#bfd2ef}.badge.green{background:#e8f7ef;color:#276b4d;border-color:#b4dfc6}.badge.red{background:#fff1f1;color:#a43434;border-color:#ebbbbb}.list-item{padding:10px 0;border-bottom:1px dashed #e7dfcf}.list-item:last-child{border-bottom:0}.list-item h4{margin:0 0 4px;font-size:14px}.member-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.member{background:#fffaf0;border:1px solid #eadfca;border-radius:9px;padding:9px}.member.player{border-color:#d5ad46;background:#fff8dd}.heat-card{border-left:4px solid var(--pink);background:#fff7fa}.log-list{max-height:280px;overflow:auto}.log-line{font-size:12px;line-height:1.6;padding:7px 0;border-bottom:1px dashed #eee5d5}.log-line:last-child{border-bottom:0}.metric-line{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:6px 0}.notice{padding:10px;border-radius:9px;background:#f7f4ec;border:1px solid var(--line);font-size:12px;line-height:1.65}.notice.warn{background:#fff7e7;border-color:#edd190}.notice.danger{background:#fff1f1;border-color:#e8b5b5}.notice.good{background:#eefaf3;border-color:#b7dfc6}.tab-table{width:100%;border-collapse:collapse;font-size:11px}.tab-table th,.tab-table td{text-align:left;padding:7px 4px;border-bottom:1px solid #eee7d9;vertical-align:top}.tab-table th{color:#756e62;font-weight:700}.modal-layer{position:fixed;inset:0;z-index:50;background:rgba(35,28,17,.45);display:none;align-items:center;justify-content:center;padding:15px}.modal-layer.open{display:flex}.modal{width:min(100%,620px);max-height:88vh;overflow:auto;background:#fffdf8;border:1px solid #e4d4ac;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:16px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:10px}.modal-head h3{margin:0;color:var(--gold-dark)}.close-btn{background:transparent;border:0;color:#887b68;padding:4px 7px;font-size:18px}.chat-history{background:#faf8f1;border:1px solid var(--line);border-radius:9px;max-height:330px;overflow:auto;padding:9px}.bubble{max-width:88%;padding:8px 10px;border-radius:10px;margin:6px 0;line-height:1.55;font-size:13px;white-space:pre-wrap}.bubble.me{margin-left:auto;background:#fff1c8;border:1px solid #ead39a}.bubble.them{background:#fff;border:1px solid #e4ddd0}.toast{position:fixed;z-index:100;left:50%;bottom:82px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;background:#2f2a22;color:#fff;padding:10px 14px;border-radius:9px;font-size:12px;transition:.2s;max-width:min(92vw,520px);text-align:center;white-space:pre-wrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.role-card{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}.heat-number{font-size:24px;font-weight:800;color:var(--pink)}.color-dot{width:13px;height:13px;border-radius:50%;display:inline-block;vertical-align:-2px;border:1px solid rgba(0,0,0,.15)}.empty{padding:18px;text-align:center;color:#999;font-size:13px}.accent{color:var(--pink);font-weight:800}.gold{color:var(--gold-dark);font-weight:800}@media(max-width:500px){.shell{padding-left:9px;padding-right:9px}.two-col{grid-template-columns:1fr}.three-col{grid-template-columns:1fr 1fr}.topbar{padding-left:9px;padding-right:9px}.top-stats{gap:4px}.pill{font-size:10px;padding:3px 6px}.hero h1{font-size:25px}.nav button{font-size:10px;padding-left:3px;padding-right:3px}}
.nav{overflow-x:auto;justify-content:flex-start}.nav button{flex:0 0 auto;min-width:62px}.phone-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.phone-app{min-height:76px;border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:9px 5px;text-align:center;cursor:pointer}.phone-app .app-emoji{font-size:24px;display:block;margin-bottom:4px}.phone-app b{font-size:11px}.feed-card{border-left:4px solid var(--blue);background:#f8fbff}.feed-card.drama{border-color:var(--red);background:#fff5f5}.feed-card.promo{border-color:var(--pink);background:#fff7fa}.feed-card.data{border-color:var(--gold);background:#fffaf0}.map-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.map-place{padding:14px 9px;border:1px solid var(--line);border-radius:12px;background:var(--cream);text-align:center}.map-place .place-emoji{font-size:25px;display:block;margin-bottom:5px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}@media(max-width:500px){.phone-grid{grid-template-columns:repeat(4,1fr);gap:6px}.map-grid{gap:6px}.map-place{padding:11px 5px}.nav button{min-width:56px}}.app-view{display:flex;flex-direction:column;min-height:70vh}.app-topbar{display:flex;align-items:center;gap:10px;color:#f7f1e3;padding:11px 13px;border-radius:12px;margin-bottom:10px;box-shadow:var(--shadow)}.app-topbar button{background:rgba(255,255,255,.16);border-color:transparent;color:#f7f1e3;padding:6px 11px;font-size:12px}.app-topbar b{font-size:16px;letter-spacing:.5px}.app-body{flex:1}.hub-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.hub-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);border-radius:12px;background:var(--cream);padding:13px;cursor:pointer;text-align:left}.hub-card .place-emoji{font-size:24px}.hub-card b{font-size:14px}.hub-card:hover{border-color:var(--gold)}.bigmap{position:relative;height:440px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,#eef3e6,#f9f4e0 55%,#e8eef7);overflow:hidden;margin-bottom:10px}.bigmap:before{content:"";position:absolute;left:-10%;top:58%;width:130%;height:34px;background:rgba(96,165,250,.25);border-radius:50%;transform:rotate(-7deg)}.map-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 9px;cursor:pointer;box-shadow:0 3px 8px rgba(60,45,20,.08)}.map-node .place-emoji{font-size:20px}.map-node b{font-size:11px}.map-node:hover{border-color:var(--gold)}

<body>
<div id="app">
  <header id="topbar" class="topbar hidden">
    <div class="brand-mini">✦ K-POP 艺人档案</div>
    <div class="top-stats">
      <span class="pill">📅 <b id="uiDate">2026年1月W1</b></span>
      <span class="pill">⚡ <b id="uiEnergy">100</b>/<span id="uiMaxEnergy">100</span><span class="energy-bar"><span id="uiEnergyFill" class="energy-fill" style="width:100%"></span></span></span>
      <button class="btn-small btn-secondary" data-action="advance-week">推进一周</button>
      <button class="btn-small btn-secondary" data-action="system-panel">⚙ 系统</button>
    </div>
  </header>

  <main id="welcome" class="welcome">
    <div class="hero">
      <div style="font-size:42px;margin-bottom:5px">🎤</div>
      <h1>K-POP 艺人模拟器</h1>
      <p>从练习室出发，以爱豆身份踏上星路。回归、打歌、粉圈、关系和多栖人生，都由你的选择决定。</p>
      <div id="continueBox" class="notice good hidden" style="text-align:left;margin:12px 0">检测到本地生涯：<b id="continueSummary"></b><div class="button-row"><button data-action="continue-save">继续这段生涯</button><button class="btn-secondary" data-action="discard-save">删除本地存档</button></div></div>
      <div class="card form-card">
        <h3 class="tg">建立你的艺人档案</h3>
        <div class="two-col">
          <div><label class="label" for="createRealName">真实姓名</label><input id="createRealName" placeholder="例如：金夏琳"></div>
          <div><label class="label" for="createStageName">艺名</label><input id="createStageName" placeholder="例如：Harin"></div>
        </div>
        <div class="two-col">
          <div><label class="label" for="createFandomName">粉丝名</label><input id="createFandomName" placeholder="例如：Starlit"></div>
          <div><label class="label" for="createGender">性别/舞台路线</label><select id="createGender"><option>女</option><option>男</option><option>非二元</option><option>自定义</option></select></div>
        </div>
        <label class="label" for="createColor">应援色</label><input id="createColor" type="color" value="#e8b84b" style="height:42px;padding:4px">
        <label class="label" for="createGroupType">初始爱豆路线（职业固定为爱豆）</label><select id="createGroupType"><option value="girl">女团</option><option value="boy">男团</option><option value="mixed">混声团</option><option value="band">乐队</option><option value="solo">Solo 爱豆</option></select>
        <label class="label" for="createAgency">签约公司</label><select id="createAgency"><option value="rookie">星曜娱乐 · 中小企划社（自由度高）</option><option value="major">韩流星河 · 大型企划社（资源强、分成低）</option><option value="indie">月桂厂牌 · 独立厂牌（制作自由）</option></select>
        <label class="label" for="createStartMode">开局阶段</label><select id="createStartMode"><option value="trainee">练习生：从训练与 Showcase 开始</option><option value="rookie">签约新人：直接进入出道准备</option></select>
        <div class="button-row"><button data-action="new-game">开始我的爱豆生涯</button></div>
        <p class="tiny muted" style="margin:9px 0 0">初始职业永远是爱豆；制作人、Solo 歌手、演员等身份会在生涯中逐步解锁，并且可以并行发展。</p>
      </div>
    </div>
  </main>

  <main id="gameShell" class="shell hidden">
    <section id="page-profile" class="page active"></section>
    <section id="page-map" class="page"></section>
    <section id="page-schedule" class="page"></section>
    <section id="page-project" class="page"></section>
    <section id="page-phone" class="page"></section>
    <div id="legacyBuffers" class="hidden" aria-hidden="true">
      <section id="page-comeback"></section>
      <section id="page-stage"></section>
      <section id="page-fandom"></section>
      <section id="page-company"></section>
      <section id="page-records"></section>
      <section id="page-settings"></section>
    </div>
  </main>

  <nav id="mainNav" class="nav hidden">
    <button class="active" data-tab="profile">档案</button>
    <button data-tab="map">地图</button>
    <button data-tab="schedule">记事</button>
    <button data-tab="project">企划</button>
    <button data-tab="phone">手机</button>
  </nav>

  <div id="modalLayer" class="modal-layer"><div id="modalBox" class="modal"></div></div>
  <div id="toast" class="toast"></div>
</div>

<script>
'use strict';
/* =========================================================
   K-POP 艺人模拟器
   原作内核参考：歌曲质量、首周流媒、后劲/衰减、边际递减、收入结算。
   本文件只保留一套状态和一套结算入口，避免旧版多层覆盖。
========================================================= */
const STORAGE_KEY='kpop_artist_simulator_save_v1';
const NAME_CONFIG={
  charts:{global:'全球流媒榜',digital:['Melon','Genie','Bugs','FLO'],album:['Circle Chart','Hanteo']},
  awards:['MAMA 风格大赏','MMA 风格大赏','GDA 风格大赏','SMA 风格大赏'],
  groups:{girl:'女团',boy:'男团',mixed:'混声团',band:'乐队',solo:'Solo'}
};
const SHOWS=[
  {id:'mcount',name:'M Countdown',weights:{stream:.40,sales:.15,broadcast:.15,fandom:.20,live:.10}},
  {id:'musicbank',name:'Music Bank',weights:{stream:.35,sales:.25,broadcast:.20,fandom:.10,live:.10}},
  {id:'musiccore',name:'Show! Music Core',weights:{stream:.45,sales:.15,broadcast:.15,fandom:.15,live:.10}},
  {id:'inkigayo',name:'Inkigayo',weights:{stream:.40,sales:.20,broadcast:.15,fandom:.15,live:.10}},
  {id:'showchamp',name:'Show Champion',weights:{stream:.40,sales:.20,broadcast:.15,fandom:.15,live:.10}},
  {id:'theshow',name:'The Show',weights:{stream:.35,sales:.20,broadcast:.20,fandom:.15,live:.10}}
];
const AGENCIES={
  rookie:{name:'星曜娱乐',tier:'中小企划社',resource:1.00,split:.70,producer:58,manager:54,freedom:78,contractYears:4,sidePermissions:['singer']},
  major:{name:'韩流星河',tier:'大型企划社',resource:1.22,split:.55,producer:72,manager:70,freedom:42,contractYears:7,sidePermissions:['singer']},
  indie:{name:'月桂厂牌',tier:'独立厂牌',resource:.92,split:.82,producer:66,manager:48,freedom:92,contractYears:3,sidePermissions:['singer','producer']}
};
const SKILLS=[['vocal','唱功'],['dance','舞蹈'],['rap','Rap'],['stage','台风'],['visual','颜值'],['variety','综艺'],['acting','演技'],['writing','创作']];
const ROLE_LABELS={idol:'爱豆',singer:'Solo 歌手',producer:'制作人',actor:'演员'};
let state=null;
let currentTab='profile';
let toastTimer=null;
let activeChatId=null;

function uid(prefix){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);}
function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function rand(min,max){return min+Math.random()*(max-min);}
function intRand(min,max){return Math.floor(rand(min,max+1));}
function fmt(n){return Math.round(Number(n)||0).toLocaleString('zh-CN');}
function pct(n){return `${Math.round(Number(n)||0)}%`;}
function dateKey(){return `${state.time.y}-${state.time.m}-${state.time.w}`;}
function avg(values){return values.length?values.reduce((a,b)=>a+b,0)/values.length:0;}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2800);}
function notify(msg){showToast(msg);}
function logEvent(text,type='normal'){if(!state)return;state.logs.unshift({id:uid('log'),time:dateKey(),text,type});state.logs=state.logs.slice(0,80);}
function currentFans(){return state.player.fandomTotal;}
function setFansTotal(total){
  const f=Math.max(0,Math.floor(total));
  state.player.fandomTotal=f;
  const coreRatio=state.fandom.core/Math.max(1,currentFans()+Math.max(0,f-currentFans()));
  const casualRatio=state.fandom.casual/Math.max(1,currentFans()+Math.max(0,f-currentFans()));
  const core=Math.min(f,Math.max(0,Math.floor(f*clamp(coreRatio,.03,.30))));
  const casual=Math.min(Math.max(0,f-core),Math.max(0,Math.floor(f*clamp(casualRatio,.20,.60))));
  state.fandom.core=core;state.fandom.casual=casual;state.fandom.public=Math.max(0,f-core-casual);
}
function totalSkill(){return avg(SKILLS.map(([k])=>Number(state.player.skills[k]||0)));}
function currentGroup(){return state.group;}
function getMainSong(){
  const list=state.songs.filter(s=>s.released);
  return list.sort((a,b)=>Number(b.isTitle)-Number(a.isTitle)||b.stmGlobal_Week-a.stmGlobal_Week)[0]||null;
}
function agencyInfo(){return state.agency;}
function relationById(id){return state.relations.find(r=>r.id===id);}
function saveGame(silent=false){
  if(!state)return;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(!silent)notify('已保存当前艺人生涯。');}catch(e){notify('保存失败：浏览器存储空间可能不足。');}
}
/* ===== P0 周循环与统一账本基础 ===== */

function groupFit(){return state.group?state.group.chemistry/100:1;}
function createTrack(name,opts={}){const p=state.player;const quality=calcMediaScores((p.skills.writing*0.55+state.agency.producer*.45),(p.skills.vocal*.55+p.skills.stage*.45),opts.mainstream!==false,!!state.comeback&&state.comeback.phase<=0);const role=opts.role||'唱跳';const stageFactor=role==='Vocal'?p.skills.vocal/70:role==='Rapper'?p.skills.rap/70:(p.skills.vocal*.35+p.skills.dance*.35+p.skills.stage*.30)/70;const expectation=clamp((state.player.publicFavor/100+.55)*(state.comeback?.hype||1)*(1+state.fandom.emotion/500),.45,2.2);const sVal=opts.sVal||1;const chain=opts.chain||1;const order=opts.order||1;const feat=opts.feat?1.2:1;const randomMod=rand(.9,1.1);const fans=currentFans()+(opts.feat?Math.floor(currentFans()*.2):0);const daily=Math.max(5000,Math.floor(fans*expectation*sVal*quality.qualityMod*chain*order*feat*randomMod*state.agency.resource*(.85+Number(state.agencyState?.resourcePool||60)/400)*groupFit()*clamp(stageFactor,.55,1.45)));const usRatio=rand(.35,.55);const song={id:uid('song'),name,artist:state.player.stageName,type:'track',role,quality:quality.score,pitchfork:quality.pitch,rolling:quality.rolling,qualityMod:quality.qualityMod,expectation,sVal,chain,order,feat,stageFactor,agencyResource:state.agency.resource,groupFit:groupFit(),released:false,isTitle:!!opts.isTitle,isBside:!!opts.isBside,isSolo:!!opts.isSolo,releaseDate:null,weeks:0,days:0,stmGlobal:0,stmGlobal_Week:daily*7,stmGlobal_Day:daily,stmUS:0,stmUS_Week:Math.floor(daily*7*usRatio),stmUS_Day:Math.floor(daily*usRatio),slTotal:0,revenue:0,peak:999,lastRank:999,viralWeeks:0,viralBoost:1,viralChance:opts.isTitle?.003:.0015,promoBoost:0,chartHistory:[],notes:opts.notes||''};return song;}
function heatLabel(s){if(!s)return '暂无';const v=s.slTotal;return v>=10000000?'🔥 神曲':v>=5000000?'大爆曲':v>=1000000?'热曲':v>=500000?'小热曲':v>=100000?'平稳':'新人曲';}
function calculateRealisticFanGain(originalGain,current){if(originalGain<=0)return 0;let mult=current<5000000?3:current<20000000?1.5:current<50000000?.8:current<100000000?.3:current<300000000?.05:.01;if(originalGain>100000)mult*=1.2;return Math.floor(originalGain*mult);}
function applyFanGain(raw,source='song'){const amount=Number(raw)||0;if(state&&state.week&&state.week.ledger){const key=source==='sales'?'sales':source==='dialogue'?'dialogue':source==='public'?'public':'song';state.week.ledger.fanRaw[key]=(state.week.ledger.fanRaw[key]||0)+amount;return calculateRealisticFanGain(Math.max(0,amount),currentFans());}if(amount>0){const real=calculateRealisticFanGain(amount,currentFans());state.player.fandomTotal+=real;const coreShare=source==='sales'?.45:source==='dialogue'?.18:source==='public'?.08:.20;state.fandom.core+=Math.floor(real*coreShare);state.fandom.casual+=Math.floor(real*(source==='public'?.35:.45));state.fandom.public=Math.max(0,state.player.fandomTotal-state.fandom.core-state.fandom.casual);return real;}return 0;}

/* ===== 打歌与安可 ===== */
function stageScore(song){if(!song)return 0;const p=state.player;const base=song.role==='Vocal'?p.skills.vocal*.6+p.skills.stage*.4:song.role==='Rapper'?p.skills.rap*.5+p.skills.stage*.5:p.skills.vocal*.3+p.skills.dance*.35+p.skills.stage*.35;return clamp(base-state.player.fatigue*.12+rand(-8,8),0,100);}
function performShow(showId){const show=SHOWS.find(x=>x.id===showId),song=getMainSong();if(!show||!song){notify('需要一首已发行的主打歌。');return;}if(!spendEnergy(12))return;const w=show.weights;const streamScore=clamp(35+Math.log10(Math.max(1000,song.stmGlobal_Week))*6,35,100);const salesScore=clamp(35+Math.log10(Math.max(100,song.firstWeekSales||song.slTotal))*8,35,100);const broadcast=clamp(48+state.agency.manager*.25+rand(-10,10),0,100);const fanScore=clamp(35+state.fandom.organization*.45+state.fandom.emotion*.18+(state.fandom.votePower||0),0,100);const live=stageScore(song);const total=streamScore*w.stream+salesScore*w.sales+broadcast*w.broadcast+fanScore*w.fandom+live*w.live;const opponent=rand(55,88);const win=total>=opponent;const candidate=total>=Math.max(60,opponent-9);const rec={id:uid('show'),date:dateKey(),show:show.name,song:song.name,total:Math.round(total),candidate,win,encore:null};state.shows.unshift(rec);state.fandom.votePower=0;if(win){state.records.wins++;state.fandom.emotion=clamp(state.fandom.emotion+3,0,100);logEvent(`${show.name} 一位！《${song.name}》总分 ${Math.round(total)}，候补对手 ${Math.round(opponent)}。`,'good');}else logEvent(`${show.name} 本周${candidate?'进入候补':'未进入候补'}，《${song.name}》总分 ${Math.round(total)}。`);saveGame();renderAll();openModal(`${show.name} · ${win?'一位！':'本周结果'}`,`<div class="notice ${win?'good':'warn'}"><b>${win?'🎉 恭喜获得一位':'📺 舞台结算完成'}</b><br>《${esc(song.name)}》总分：${Math.round(total)}<br>音源 ${Math.round(streamScore)} · 销量 ${Math.round(salesScore)} · 放送 ${Math.round(broadcast)} · 粉丝 ${Math.round(fanScore)} · 现场 ${Math.round(live)}<br>${win?'安可舞台会检验你的真实唱功。':candidate?'进入候补，但对手在最后一刻领先。':'本周先积累舞台和粉丝情感。'}</div><div class="button-row">${win?`<button data-action="encore" data-show-id="${rec.id}">进行安可</button>`:''}<button class="btn-secondary" data-action="close-modal">关闭</button></div>`);}
function encore(showId){const rec=state.shows.find(x=>x.id===showId);if(!rec)return;const song=state.songs.find(s=>s.name===rec.song);const score=stageScore(song);const good=score>=54;rec.encore=good?'实力出圈':'安可翻车';if(good){state.records.encoreGood++;state.player.publicFavor=clamp(state.player.publicFavor+3,0,100);state.fandom.trust=clamp(state.fandom.trust+3,0,100);logEvent(`安可实力出圈：唱功和情绪都稳住了，粉丝信任上升。`,'good');}else{state.records.encoreBad++;state.player.publicFavor=clamp(state.player.publicFavor-4,0,100);triggerControversy('安可翻车',false);logEvent(`安可翻车：疲劳或现场状态影响了发挥。`,'danger');}saveGame();renderAll();openModal('安可结算',`<div class="notice ${good?'good':'danger'}"><b>${good?'🌟 安可实力出圈':'⚠️ 安可翻车'}</b><br>现场评分：${Math.round(score)}。${good?'粉丝开始分享你的真实实力。':'舆论需要你的后续行动来修复。'}</div><div class="button-row"><button data-action="close-modal">确认</button><button class="btn-pink" data-action="open-chat" data-chat-id="fanrep">和粉丝代表聊聊</button></div>`);}
/* ===== 粉圈和舆论 ===== */
function fanAction(kind){const song=getMainSong();if(kind==='stream'){if(state.fandom.organization<6||!song){notify('需要组织度 6 和一首已发行歌曲。');return;}state.fandom.organization-=6;const boost=Math.floor(song.stmGlobal_Week*(.055+state.fandom.trust/2000));song.stmGlobal_Week+=boost;song.stmGlobal_Day=Math.floor(song.stmGlobal_Week/7);state.fandom.lastAction='音源总攻';logEvent(`粉丝发起音源总攻，《${song.name}》周流媒增加 ${fmt(boost)}。`,'good');}
  if(kind==='vote'){if(state.fandom.organization<8){notify('组织度不足以发动大型打投。');return;}state.fandom.organization-=8;state.fandom.votePower=(state.fandom.votePower||0)+18;state.fandom.lastAction='事前打投';logEvent('核心粉丝完成事前投票集结，本周打歌粉丝分提升。','good');}
  if(kind==='fund'){if(!state.comeback||state.comeback.released){notify('只有筹备中的回归可以进行集资。');return;}state.fandom.organization=clamp(state.fandom.organization+8,0,100);state.comeback.preorderBoost=(state.comeback.preorderBoost||0)+Math.floor(state.fandom.core*.08);state.fandom.emotion=clamp(state.fandom.emotion+3,0,100);state.fandom.lastAction='回归集资';logEvent('粉圈完成回归集资，预购潜力和组织度提升。','good');}
  if(kind==='support'){if(state.player.funds<50000){notify('需要 $50,000 作为生日/地铁应援预算。');return;}state.player.funds-=50000;state.fandom.emotion=clamp(state.fandom.emotion+7,0,100);state.fandom.trust=clamp(state.fandom.trust+5,0,100);state.player.publicFavor=clamp(state.player.publicFavor+1,0,100);state.fandom.lastAction='生日应援';logEvent('你参与粉丝应援，情感连接和信任提升。','good');}
  saveGame();renderAll();notify('粉圈行动已完成。');}
function triggerControversy(type,notifyUser=true){const c={id:uid('issue'),type,severity:intRand(1,3),status:'active',date:dateKey(),impact:type==='安可翻车'?'现场争议':'舆论争议',resolution:null};state.controversies.unshift(c);state.fandom.trust=clamp(state.fandom.trust-c.severity*2,0,100);state.fandom.emotion=clamp(state.fandom.emotion-c.severity,0,100);if(notifyUser)notify(`发生争议：${type}。请到粉圈页处理。`);}
function resolveControversy(method,id){const c=state.controversies.find(x=>x.id===id);if(!c||c.status!=='active')return;const cost=method==='legal'?80000:method==='apology'?0:method==='press'?20000:0;if(state.player.funds<cost){notify('资金不足以执行这项公关。');return;}state.player.funds-=cost;c.status='resolved';c.resolution=method;let trust=method==='apology'?6:method==='press'?3:method==='legal'?1:-2;state.fandom.trust=clamp(state.fandom.trust+trust,0,100);state.player.publicFavor=clamp(state.player.publicFavor+(method==='ignore'?-2:method==='apology'?2:1),0,100);logEvent(`针对“${c.type}”采取${method==='legal'?'法律维权':method==='apology'?'公开道歉':method==='press'?'正式通稿':'冷处理'}。`,'good');saveGame();renderAll();}
/* ===== 公司、合约、多栖 ===== */
function roleRequirement(role){if(role==='singer')return state.songs.some(s=>s.released);if(role==='producer')return state.player.skills.writing>=55&&state.songs.some(s=>s.released);if(role==='actor')return state.player.skills.acting>=50||state.player.publicFavor>=45;return true;}
function requestRole(role){if(state.player.activeRoles.includes(role)){notify(`你已经拥有${ROLE_LABELS[role]}身份。`);return;}if(!roleRequirement(role)){notify(role==='producer'?'先积累创作能力和已发行作品。':role==='actor'?'先提升演技或公众好感。':'先发行一首团体/个人作品。');return;}const allowed=state.agency.contract.status==='expired'||state.agency.contract.sidePermissions.includes(role)||state.agency.freedom>75;const manager=relationById('manager');const chance=allowed?.92:clamp(.25+(manager.trust||0)/180,0,.78);if(Math.random()>chance){manager.trust=clamp(manager.trust-3,0,100);logEvent(`公司暂未批准你开展${ROLE_LABELS[role]}路线。`,'warn');notify('申请被暂缓，可以先改善与经纪人的沟通。');return;}state.player.activeRoles.push(role);state.player.sideCareerSlots++;state.records.transitions.unshift({date:dateKey(),action:`解锁${ROLE_LABELS[role]}`});logEvent(`解锁新身份：${ROLE_LABELS[role]}。从此可以和爱豆活动并行发展。`,'good');saveGame();renderAll();notify(`已解锁${ROLE_LABELS[role]}路线。`);}
function setPrimaryRole(role){if(!state.player.activeRoles.includes(role))return;state.player.primaryRole=role;logEvent(`将当前主线身份切换为${ROLE_LABELS[role]}。`);saveGame();renderAll();}
function actorJob(){if(!state.player.activeRoles.includes('actor')){notify('请先解锁演员路线。');return;}if(!spendEnergy(24))return;const score=state.player.skills.acting*.7+state.player.skills.variety*.2+state.player.publicFavor*.1+rand(-8,8);const income=Math.floor(70000+score*2500);state.player.skills.acting=clamp(state.player.skills.acting+rand(.5,1.8),0,100);state.player.publicFavor=clamp(state.player.publicFavor+(score>65?2:.5),0,100);state.player.funds+=Math.floor(income*(state.agency.contract.status==='active'?state.agency.split:.85));logEvent(`完成一次影视/综艺试镜与拍摄，表现 ${Math.round(score)}，到账 $${fmt(income)}。`,'good');saveGame();renderAll();}
function producerJob(){if(!state.player.activeRoles.includes('producer')){notify('请先解锁制作人路线。');return;}if(!spendEnergy(20))return;const quality=state.player.skills.writing*.65+state.agency.producer*.35+rand(-8,8);const income=Math.floor(50000+quality*2300);state.player.skills.writing=clamp(state.player.skills.writing+rand(.6,1.6),0,100);const prod=relationById('producer');if(prod)prod.trust=clamp(prod.trust+2,0,100);state.player.funds+=Math.floor(income*(state.agency.contract.status==='active'?state.agency.split:.88));logEvent(`完成一次供曲/制作工作，制作评分 ${Math.round(quality)}，到账 $${fmt(income)}。`,'good');saveGame();renderAll();}
function soloRelease(){if(!state.player.activeRoles.includes('singer')){notify('请先解锁 Solo 歌手路线。');return;}const name=(prompt('为你的 Solo 单曲命名：',`${state.player.stageName} Solo`)||'').trim();if(!name)return;if(state.player.funds<15000){notify('Solo 制作至少需要 $15,000。');return;}state.player.funds-=15000;const s=createTrack(name,{isTitle:true,isSolo:true,role:state.player.skills.vocal>state.player.skills.dance?'Vocal':'唱跳',sVal:.9,order:1});s.released=true;s.releaseDate=dateKey();s.firstWeekSales=Math.floor(state.fandom.core*.12);s.slTotal=s.firstWeekSales;state.songs.push(s);state.player.publicFavor=clamp(state.player.publicFavor+1.5,0,100);logEvent(`个人 Solo 单曲《${name}》发行，保留爱豆身份并开启个人歌手履历。`,'good');saveGame();renderAll();notify(`Solo 单曲《${name}》已上线。`);}
function renewContract(){if(state.agency.contract.status!=='expired'){notify('当前合约还没有到期。');return;}state.agency.contract.status='active';state.agency.contract.endYear=state.time.y+3;state.agency.contract.renewals++;state.agency.contract.split=clamp(state.agency.split+.05,.4,.9);state.agency.split=state.agency.contract.split;logEvent(`续约成功：合约延长至 ${state.agency.contract.endYear} 年，艺人分成提升。`,'good');saveGame();renderAll();}
function leaveAgency(){if(state.agency.contract.status!=='expired'){notify('合约未到期，不能直接离开公司。');return;}state.agency.contract.status='free';state.agency.name='自由艺人';state.agency.tier='独立运营';state.agency.resource=.82;state.agency.split=.88;state.agency.freedom=100;state.agency.contract.sidePermissions=['singer','producer','actor'];state.player.sideCareerSlots+=2;logEvent('合约到期后成为自由艺人，获得完整多栖自由度。','good');saveGame();renderAll();}
function changeAgency(){if(state.agency.contract.status!=='expired'){notify('请等合约到期后再谈新公司。');return;}const name=(prompt('输入新公司名称：','新的企划社')||'').trim();if(!name)return;state.agency.name=name;state.agency.tier='新签约公司';state.agency.resource=1.05;state.agency.split=.72;state.agency.freedom=65;state.agency.contract.status='active';state.agency.contract.endYear=state.time.y+4;state.agency.contract.sidePermissions=['singer'];logEvent(`转入新公司：${name}，重新签署四年合约。`,'good');saveGame();renderAll();}
/* ===== 对话与 API ===== */
function openModal(title,body){const layer=document.getElementById('modalLayer'),box=document.getElementById('modalBox');box.innerHTML=`<div class="modal-head"><h3>${title}</h3><button class="close-btn" data-action="close-modal">×</button></div><div>${body}</div>`;layer.classList.add('open');}
function closeModal(){document.getElementById('modalLayer').classList.remove('open');}
function openChat(id){const r=relationById(id);if(!r)return;activeChatId=id;const history=(r.history||[]).map(m=>`<div class="bubble ${m.from==='me'?'me':'them'}">${esc(m.text)}</div>`).join('')||'<div class="empty">还没有对话。你可以先说点什么。</div>';openModal(`与 ${esc(r.name)} 对话`,`<div class="notice"><b>${esc(r.role)}</b> · 亲密 ${Math.round(r.intimacy)} · 信任 ${Math.round(r.trust)} · 支持 ${Math.round(r.support)}<br><span class="muted">${esc(r.personality||'')}</span></div><div id="chatHistory" class="chat-history">${history}</div><textarea id="chatInput" placeholder="输入你想说的话……"></textarea><div class="button-row"><button data-action="send-chat">发送</button><button class="btn-secondary" data-action="close-modal">关闭</button></div>`);}
function localReply(r,text){const lower=text.toLowerCase();if(r.kind==='fan')return lower.includes('谢谢')||lower.includes('辛苦')?'你愿意回应已经让大家很感动了，我们会把这份心意传回粉圈。':'我会把你的话告诉站子和大家。你不用每次都完美，愿意真诚地出现就很好。';if(r.kind==='manager')return lower.includes('休息')||lower.includes('累')?'我会把这段行程重新排一下，先把你的健康放在前面。':'我记下来了。我们会在合约和实际资源之间，尽量给你留下选择空间。';if(r.kind==='producer')return lower.includes('主打')||lower.includes('歌曲')?'那就把你的声音特点再放大一点，Demo 我会按这个方向继续打磨。':'创作不是一次定稿，先把你真正想表达的东西说清楚。';if(r.kind==='teammate')return lower.includes('对不起')||lower.includes('抱歉')?'我也不想和你把误会留到舞台上，我们找个时间好好聊聊。':'我听到了。无论舞台上站在哪里，我们还是一起走到这里的队友。';return '我收到你的消息了。';}
async function callApi(prompt){const a=state.api||{};if(!a.endpoint||!a.token)return null;try{const url=a.endpoint.replace(/\/$/,'')+(a.path||'/chat/completions');const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${a.token}`},body:JSON.stringify({model:a.model||'gpt-4o-mini',messages:[{role:'user',content:prompt}],temperature:.85})});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();return data.choices?.[0]?.message?.content||data.output_text||null;}catch(e){notify(`API 暂时不可用：${e.message}`);return null;}}
function parseIntent(text){const t=String(text||'');if(/道歉|对不起|抱歉/.test(t))return'apology';if(/支持|加油|陪你|没关系/.test(t))return'support';if(/拒绝|不要|不行/.test(t))return'refuse';if(/邀约|一起|合作/.test(t))return'invite';return'neutral';}
async function sendChat(){const r=relationById(activeChatId),input=document.getElementById('chatInput');if(!r||!input||!input.value.trim())return;const text=input.value.trim();r.history=r.history||[];r.history.push({from:'me',text,date:dateKey()});r.intimacy=clamp(r.intimacy+1,0,100);r.trust=clamp(r.trust+(text.length>8?1:.3),0,100);if(r.kind==='fan'){state.fandom.intimacy=clamp(state.fandom.intimacy+1,0,100);state.fandom.trust=clamp(state.fandom.trust+.5,0,100);}const prompt=`你是K-POP艺人模拟器中的角色“${r.name}”。角色身份：${r.role}。人设：${r.personality}。你与玩家${state.player.stageName}的亲密度${Math.round(r.intimacy)}、信任度${Math.round(r.trust)}、当前情绪${Math.round(r.mood)}。最近发生的事件：${state.logs.slice(0,3).map(x=>x.text).join('；')}。玩家刚刚说：“${text}”。请用自然、具体、符合关系状态的中文回复，回复控制在80字以内。不要输出系统说明，不要擅自改变游戏数值；如果有明确态度，可以在末尾用括号写一个意图词：支持、道歉、拒绝、邀约或暂缓。`;closeModal();renderAll();notify('对方正在回复……');let reply=await callApi(prompt);if(!reply)reply=localReply(r,text);r.history.push({from:'them',text:reply,date:dateKey()});const intent=parseIntent(reply);if(intent==='support'){r.support=clamp(r.support+2,0,100);state.fandom.emotion=clamp(state.fandom.emotion+1,0,100);}if(intent==='apology'){r.trust=clamp(r.trust+2,0,100);}if(intent==='refuse'){r.mood=clamp(r.mood-2,0,100);}logEvent(`与${r.name}进行了一次对话，关系发生细微变化。`);saveGame();renderAll();openChat(r.id);}
function apiConfigValues(prefix=''){const ids=prefix==='settings'?{endpoint:'settingsApiEndpoint',path:'settingsApiPath',token:'settingsApiToken',model:'settingsApiModel',select:'settingsApiModelSelect'}:{endpoint:'apiEndpoint',path:'apiPath',token:'apiToken',model:'apiModel',select:'apiModelSelect'};const id=x=>document.querySelector('#modalBox #'+ids[x])||document.getElementById(ids[x]);return {endpoint:(id('endpoint')||{}).value?.trim()||'',path:(id('path')||{}).value?.trim()||'/chat/completions',token:(id('token')||{}).value?.trim()||'',modelInput:id('model'),select:id('select')};}
async function fetchApiModels(prefix=''){const cfg=apiConfigValues(prefix);if(!cfg.endpoint){notify('请先填写 API Endpoint。');return;}if(!cfg.token){notify('请先填写 API Key，再拉取模型。');return;}const base=cfg.endpoint.replace(/\/$/,'');const path=cfg.path||'/chat/completions';let root=base;if(/\/chat\/completions\/?$/i.test(root))root=root.replace(/\/chat\/completions\/?$/i,'');else if(path&&root.endsWith(path.replace(/\/$/,'')))root=root.slice(0,-path.replace(/\/$/,'').length);const url=root+'/models';try{notify('正在拉取模型列表……');const response=await fetch(url,{method:'GET',headers:{Authorization:`Bearer ${cfg.token}`,Accept:'application/json'}});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();const rows=Array.isArray(data)?data:(Array.isArray(data.data)?data.data:Array.isArray(data.models)?data.models:[]);const ids=rows.map(x=>typeof x==='string'?x:x&& (x.id||x.name||x.model)).filter(Boolean).map(String).filter((x,i,a)=>a.indexOf(x)===i).sort();if(!ids.length)throw new Error('返回结果中没有模型 ID');if(cfg.select){cfg.select.innerHTML='<option value="">选择已拉取的模型</option>'+ids.map(id=>'<option value="'+esc(id)+'">'+esc(id)+'</option>').join('');cfg.select.classList.remove('hidden');cfg.select.onchange=()=>{if(cfg.select.value&&cfg.modelInput)cfg.modelInput.value=cfg.select.value;};}if(cfg.modelInput&&!cfg.modelInput.value)cfg.modelInput.value=ids[0];notify(`已拉取 ${ids.length} 个模型。`);}catch(error){notify(`模型拉取失败：${error.message}。也可以手动填写模型名。`);}}
function saveApi(){state.api.endpoint=(document.getElementById('apiEndpoint')?.value||'').trim();state.api.path=(document.getElementById('apiPath')?.value||'/chat/completions').trim()||'/chat/completions';state.api.token=(document.getElementById('apiToken')?.value||'').trim();state.api.model=(document.getElementById('apiModel')?.value||'').trim();saveGame();notify('API 配置已保存。');}
function generateFanLetter(){const fan=relationById('fanrep');if(!fan)return;const letter=`${state.player.stageName}，最近的舞台辛苦了。无论榜单结果怎样，你在镜头前认真发光的样子，已经给了很多人继续生活的勇气。请记得吃饭和休息。`;fan.history=fan.history||[];fan.history.push({from:'them',text:letter,date:dateKey()});state.messages.unshift({id:uid('msg'),kind:'fan',date:dateKey(),title:'粉丝来信',text:letter});saveGame();renderAll();openChat('fanrep');}
/* ===== 奖项/赛季 ===== */
function seasonAwards(){const year=state.time.y-1;const songs=state.songs.filter(s=>s.releaseDate?.startsWith(String(year)));if(!songs.length)return;const best=songs.slice().sort((a,b)=>b.slTotal-a.slTotal)[0];if(best&&best.slTotal>500000){const award={id:uid('award'),year,name:best.slTotal>3000000?'年度歌曲大赏':'年度本赏',work:best.name};state.awards.unshift(award);state.player.publicFavor=clamp(state.player.publicFavor+4,0,100);state.fandom.emotion=clamp(state.fandom.emotion+5,0,100);logEvent(`${year} 年赛季结算：凭《${best.name}》获得${award.name}。`,'good');}}
/* ===== 地图、手机与系统设置 ===== */
const PHONE_PLATFORM_LABELS={WB:'热搜广场',Forum:'匿名论坛',Chart:'数据榜单',Video:'站姐视频',Mail:'艺人邮箱'};
function ensurePhone(){if(!state.phone||typeof state.phone!=='object')state.phone={posts:[],mail:[],lastPlatform:'WB',read:[]};if(!Array.isArray(state.phone.posts))state.phone.posts=[];if(!Array.isArray(state.phone.mail))state.phone.mail=[];if(!Array.isArray(state.phone.read))state.phone.read=[];return state.phone;}
function mapAction(kind){
  if(kind==='studio'){if(!spendEnergy(10))return;const v=rand(1,2.5),w=rand(.5,1.8);state.player.skills.vocal=clamp(state.player.skills.vocal+v,0,100);state.player.skills.writing=clamp(state.player.skills.writing+w,0,100);const prod=relationById('producer');if(prod)prod.trust=clamp(prod.trust+1,0,100);logEvent(`录音室闭关：唱功 +${v.toFixed(1)}，创作 +${w.toFixed(1)}，制作人信任提升。`,'good');}

  else if(kind==='tour'){const song=getMainSong();if(!song){notify('请先发行歌曲，才能规划巡演。');return;}const cost=80000;if(state.player.funds<cost){notify('小型巡演预算需要 $80,000。');return;}if(!spendEnergy(20))return;state.player.funds-=cost;const boost=Math.floor(song.stmGlobal_Week*.12);song.stmGlobal_Week+=boost;song.stmGlobal_Day=Math.floor(song.stmGlobal_Week/7);const gain=applyFanGain(Math.floor(song.stmGlobal_Week/35),'public');state.player.publicFavor=clamp(state.player.publicFavor+2,0,100);state.records.tours=(state.records.tours||0)+1;logEvent(`完成一次小型巡演：投入 $${fmt(cost)}，新增粉丝 ${fmt(gain)}，歌曲流媒额外增加。`,'good');}

  else if(kind==='deal'){createKairosDeal('fashion');return;}
  else if(kind==='military'){enterMilitary('active');return;}
  else if(kind==='home'){window.rest();return;}
  else if(kind==='company'){switchTab('company');return;}
  saveGame();renderAll();notify('地图行动完成。');
}

(function installKairosRuntime(){
  const builtins=new Set(['debut','train','rest','comebackPromo','show','fanAction','mapStudio','mapMV','mapTour','mapFashion','variety','promotion','actorJob','producerJob','soloRelease','controversy','controversyResolve','dialogue','roleRequest','teamTalk','encore','companyTalk','companyPromo','contractRenew','agencyChange','freeArtist','kairosDemo']);

  rt.actionResolvers=rt.actionResolvers||{};rt.weekHooks=rt.weekHooks||{};rt.knownActions=rt.knownActions||builtins;
  rt.registerAction=function(type,resolver){if(!type||typeof resolver!=='function')throw new Error('Kairos action resolver requires type and function');rt.actionResolvers[type]=resolver;rt.knownActions.add(type);return()=>delete rt.actionResolvers[type];};
  rt.registerWeekHook=function(name,fn){if(!name||typeof fn!=='function')throw new Error('Kairos week hook requires name and function');(rt.weekHooks[name]||(rt.weekHooks[name]=[])).push(fn);return()=>{rt.weekHooks[name]=(rt.weekHooks[name]||[]).filter(x=>x!==fn);};};

  rt.isKnownAction=function(type){return rt.knownActions.has(type)||!!rt.actionResolvers[type];};
  rt.queue=function(action){if(!rt.isKnownAction(action&&action.type))return notify(`未知行动类型：${action&&action.type||'空'}。`),false;return typeof window.queueAction==='function'?window.queueAction(action):false;};
  rt.addEffect=function(effect){return typeof applyActionEffect==='function'?applyActionEffect(effect):null;};
  rt.addFanRaw=function(source,amount){if(typeof p0AddFanRaw==='function')return p0AddFanRaw(source,amount);if(state&&state.week&&state.week.ledger)state.week.ledger.fanRaw[source]=(state.week.ledger.fanRaw[source]||0)+Number(amount||0);};rt.registerAction('kairos.companyTalk',(action,ctx)=>{ctx.addEffect({agencyFavorDelta:Number(action.favorDelta||2),agencyResourceDelta:Number(action.resourceDelta||2)});});rt.registerAction('kairos.teamTalk',(action,ctx)=>{ctx.addEffect({relationId:action.memberId,relationTrustDelta:1,relationSupportDelta:1,relationIntimacyDelta:1});});

})();

ABELS[p.primaryRole]}</span>${p.activeRoles.filter(x=>x!=='idol').map(x=>'<span class="badge blue">'+ROLE_LABELS[x]+'</span>').join('')}<br><span class="tiny muted">${esc(state.agency.name)} · ${esc(state.agency.tier)}</span></div></div><div class="stat-grid" style="margin-top:12px"><div class="stat-box">粉丝总数<b>${fmt(p.fandomTotal)}</b></div><div class="stat-box">资金<b>$${fmt(p.funds)}</b></div><div class="stat-box">公众好感<b>${Math.round(p.publicFavor)}</b></div><div class="stat-box">健康/疲劳<b>${Math.round(p.health)} / ${Math.round(p.fatigue)}</b></div></div></div><div class="card"><div class="section-title"><h3 class="tg">十维能力</h3><span class="tiny muted">潜力会在训练中逐渐显现</span></div>${skills}</div>${groupHtml}<div class="card heat-card"><div class="section-title"><h3 class="tg">粉丝情感结构</h3><span class="heat-number">${Math.round(state.fandom.emotion)}</span></div><div class="metric-line"><span>核心粉</span><b>${fmt(state.fandom.core)}</b></div><div class="metric-line"><span>普通粉</span><b>${fmt(state.fandom.casual)}</b></div><div class="metric-line"><span>路人盘</span><b>${fmt(state.fandom.public)}</b></div><div class="metric-line"><span>组织度 / 信任</span><b>${Math.round(state.fandom.organization)} / ${Math.round(state.fandom.trust)}</b></div><p class="tiny muted">K-POP 粉丝不仅追数据，也会记住你是否真诚回应、是否照顾队友和有没有把他们的陪伴放在心上。</p></div>`;}
function renderSchedule(){const trainee=state.player.stage==='trainee';const roles=state.player.activeRoles;const militaryNote=state.military&&state.military.status==='serving'?'<div class="notice warn">军白期进行中 · 剩余约 '+Math.max(0,Number(state.military.endWeek||state.week.index)-state.week.index)+' 周，普通活动已暂停。</div>':'';document.getElementById('page-schedule').innerHTML=`<div class="section-title"><h2>📝 艺人日程</h2><span class="badge">${state.time.y}年${state.time.m}月W${state.time.w}</span></div>${militaryNote}<div class="card"><div class="notice ${state.player.fatigue>75?'warn':'good'}">当前状态：${trainee?'练习生训练期':state.player.stage==='health_pause'?'健康暂停': '出道活动期'} · 精力 ${Math.round(state.player.energy)} · 疲劳 ${Math.round(state.player.fatigue)} · 健康 ${Math.round(state.player.health)}</div><div class="button-row"><button data-action="rest">休息恢复</button><button class="btn-secondary" data-action="talk" data-chat-id="manager">和经纪人沟通</button><button class="btn-pink" data-action="variety">参加综艺</button></div></div><div class="card"><h3 class="tg">${trainee?'练习室训练':'日常能力管理'}</h3><div class="button-row">${SKILLS.map(([k,label])=>`<button class="btn-secondary btn-small" data-action="train" data-skill="${k}">训练${label}</button>`).join('')}</div></div><div class="card"><h3 class="tg">多栖工作</h3><div class="button-row"><button class="btn-blue" data-action="solo-release" ${roles.includes('singer')?'':'disabled'}>发行 Solo</button><button class="btn-blue" data-action="actor-job" ${roles.includes('actor')?'':'disabled'}>影视/综艺工作</button><button class="btn-blue" data-action="producer-job" ${roles.includes('producer')?'':'disabled'}>制作/供曲</button></div><p class="tiny muted">副职业需要在公司页解锁。多栖会增加收入，也会和团体回归产生精力冲突。</p></div><div class="card"><h3 class="tg">最近行程</h3><div class="log-list">${state.logs.slice(0,12).map(l=>`<div class="log-line"><span class="muted">${esc(l.time)}</span>　${esc(l.text)}</div>`).join('')||'<div class="empty">还没有行程记录。</div>'}</div></div>`;}
function renderComeback(){const c=state.comeback;let body='';if(!c){body=`<div class="notice">回归是艺人职业的核心循环：预告、期待、发行、打歌和粉丝陪伴会共同决定歌曲能走多远。</div><label class="label">回归名称</label><input id="cbTitle" placeholder="例如：Afterglow"><div class="two-col"><div><label class="label">作品形式</label><select id="cbFormat"><option>EP</option><option>Album</option><option>Single</option><option>Special</option><option>Repackage</option></select></div><div><label class="label">歌曲数量</label><input id="cbSongCount" type="number" min="2" max="8" value="3"></div></div><label class="label">整体概念</label><input id="cbConcept" placeholder="例如：冬夜、成长、友情、暗黑梦境"><div class="button-row"><button data-action="start-comeback">立项回归</button></div>`;}else{const phase=c.released?'已发行':c.phase===-4?'W-4 概念照':c.phase===-3?'W-3 曲目列表':c.phase===-2?'W-2 Highlight Medley':c.phase===-1?'W-1 MV Teaser':'发行日准备';body=`<div class="card cream"><div class="section-title"><h3 class="tg">《${esc(c.title)}》</h3><span class="badge pink">${phase}</span></div><div class="metric-line"><span>概念</span><b>${esc(c.concept)}</b></div><div class="metric-line"><span>期待值</span><b>${c.hype.toFixed(2)}</b></div><div class="metric-line"><span>预购/初动</span><b>${c.released?fmt(c.preorder)+' / '+fmt(state.albums.find(a=>a.name===c.title)?.firstWeekSales||0):'发行后结算'}</b></div><h4>曲目表</h4><ol style="padding-left:22px">${c.tracks.map(t=>`<li>${esc(t.name)} <span class="badge ${t.isTitle?'pink':''}">${t.isTitle?'主打':t.isBside?'收录曲':'宣传曲'}</span></li>`).join('')}</ol></div>`;if(!c.released)body+=`<div class="card"><h3 class="tg">版本与粉丝购买力</h3><label><input id="vLimited" type="checkbox" ${c.versions.limited?'checked':''} style="width:auto"> 初回限定版</label><br><label><input id="vMember" type="checkbox" ${c.versions.member?'checked':''} style="width:auto"> 成员版本</label><br><label><input id="vPhotocard" type="checkbox" ${c.versions.photocard?'checked':''} style="width:auto"> 稀缺小卡/预购特典</label><br><label><input id="vFansign" type="checkbox" ${c.versions.fansign?'checked':''} style="width:auto"> 签售版与抽选</label><div class="button-row"><button class="btn-secondary" data-action="save-versions">保存版本配置</button><button data-action="comeback-step">推进一个预告阶段</button><button class="btn-pink" data-action="release-comeback" ${c.phase<0?'disabled':''}>正式发行</button></div></div>`;else body+=`<div class="card"><h3 class="tg">发行后的宣传</h3><p class="tiny muted">主打歌的流媒、销量和乐评继续沿用原作后劲模型；打歌和粉圈行动会在不改变歌曲质量的前提下放大曝光。</p><div class="metric-line"><span>已宣传周数</span><b>${c.promoWeeks}/12</b></div><div class="button-row"><button data-action="promote-song" ${c.promoWeeks>=12?'disabled':''}>参加打歌/综艺宣发</button><button class="btn-secondary" data-action="new-comeback">筹备下一次回归</button></div></div><div class="card"><h3 class="tg">歌曲热度构成</h3>${state.songs.filter(s=>s.releaseDate===c.releaseDate).map(renderSongHeat).join('')}</div>`;}document.getElementById('page-comeback').innerHTML=`<div class="section-title"><h2>💿 回归企划</h2><span class="badge">K-POP 核心循环</span></div><div class="card">${body}</div>`;}
function renderSongHeat(s){return `<div class="list-item"><h4>${esc(s.name)} ${s.isTitle?'<span class="badge pink">主打</span>':''} <span class="accent">${heatLabel(s)}</span></h4><div class="metric-line"><span>乐评 / 质量修正</span><b>${Math.round(s.quality)} · ×${s.qualityMod.toFixed(2)}</b></div><div class="metric-line"><span>期待值 / 团体适配</span><b>×${s.expectation.toFixed(2)} · ×${s.groupFit.toFixed(2)}</b></div><div class="metric-line"><span>首周预估 / 当前周流媒</span><b>${fmt(s.stmGlobal_Week)} / ${fmt(s.stmGlobal_Week)}</b></div><div class="metric-line"><span>累计流媒 / 累计销量</span><b>${fmt(s.stmGlobal)} / ${fmt(s.slTotal)}</b></div><div class="tiny muted">来源：粉丝盘 × 期待 × 质量 × 主打/曲序 × 公司资源 × 小幅随机；不会因为一次互动凭空制造爆款。</div></div>`;}
function renderStage(){const song=getMainSong();const rows=state.songs.filter(s=>s.released).sort((a,b)=>b.stmGlobal_Week-a.stmGlobal_Week).map((s,i)=>`<tr><td>#${i+1}</td><td><b>${esc(s.name)}</b><br><span class="tiny muted">${heatLabel(s)}</span></td><td>${fmt(s.stmGlobal_Week)}</td><td>${s.peak===999?'—':'#'+s.peak}</td><td>${s.chartWeeks||0}</td></tr>`).join('');document.getElementById('page-stage').innerHTML=`<div class="section-title"><h2>🎤 打歌与榜单</h2><span class="badge pink">${song?esc(song.name):'暂无主打'}</span></div><div class="card"><div class="notice">每档节目都有不同权重。音源和销量沿用原作计算，放送、粉丝投票和实时投票体现 K-POP 打歌的现场竞争。</div><div class="button-row">${SHOWS.map(show=>`<button class="btn-secondary btn-small" data-action="perform-show" data-show-id="${show.id}" ${song?'':'disabled'}>${show.name}</button>`).join('')}</div></div><div class="card"><h3 class="tg">当前歌曲榜单</h3>${rows?`<table class="tab-table"><thead><tr><th>名次</th><th>歌曲</th><th>周流媒</th><th>Peak</th><th>在榜</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">发行歌曲后，周榜走势会显示在这里。</div>'}</div><div class="card"><h3 class="tg">打歌历史</h3>${state.shows.slice(0,12).map(x=>`<div class="list-item"><b>${esc(x.show)}</b> · ${esc(x.song)} <span class="badge ${x.win?'green':''}">${x.win?'一位':x.candidate?'候补':'未入围'}</span><br><span class="tiny muted">${x.date} · 总分 ${x.total}${x.encore?' · '+x.encore:''}</span>${x.win&&!x.encore?`<button class="btn-small btn-pink" data-action="encore" data-show-id="${x.id}" style="float:right">安可</button>`:''}</div>`).join('')||'<div class="empty">还没有打歌记录。</div>'}</div>`;}
function renderFandom(){const relations=state.relations.map(r=>`<div class="role-card"><div><b>${esc(r.name)}</b><br><span class="tiny muted">${esc(r.role)} · 亲密 ${Math.round(r.intimacy)} · 信任 ${Math.round(r.trust)}</span></div><button class="btn-small btn-secondary" data-action="open-chat" data-chat-id="${r.id}">聊天</button></div>`).join('');const issues=state.controversies.map(c=>`<div class="list-item"><b>${esc(c.type)}</b> <span class="badge ${c.status==='active'?'red':'green'}">${c.status==='active'?'处理中':'已解决'}</span><br><span class="tiny muted">${c.date} · 严重度 ${c.severity}</span>${c.status==='active'?`<div class="button-row"><button class="btn-small btn-secondary" data-action="resolve" data-method="press" data-issue-id="${c.id}">发通稿</button><button class="btn-small btn-green" data-action="resolve" data-method="apology" data-issue-id="${c.id}">公开道歉</button><button class="btn-small btn-danger" data-action="resolve" data-method="legal" data-issue-id="${c.id}">法律维权</button><button class="btn-small btn-secondary" data-action="resolve" data-method="ignore" data-issue-id="${c.id}">冷处理</button></div>`:''}</div>`).join('');document.getElementById('page-fandom').innerHTML=`<div class="section-title"><h2>💖 粉圈与情感</h2><span class="badge pink">${esc(state.player.fandomName||'粉丝')}</span></div><div class="card"><div class="stat-grid"><div class="stat-box">核心粉<b>${fmt(state.fandom.core)}</b></div><div class="stat-box">普通粉<b>${fmt(state.fandom.casual)}</b></div><div class="stat-box">路人盘<b>${fmt(state.fandom.public)}</b></div><div class="stat-box">组织度/信任<b>${Math.round(state.fandom.organization)} / ${Math.round(state.fandom.trust)}</b></div></div><div class="notice" style="margin-top:10px"><span class="color-dot" style="background:${esc(state.player.fandomColor||'#e8b84b')}"></span> 应援色 · 情感情绪 ${Math.round(state.fandom.emotion)} · ${esc(state.fandom.lastAction||'等待一次互动')}</div></div><div class="card"><h3 class="tg">粉丝行动</h3><div class="button-row"><button data-action="fan-action" data-kind="stream">音源总攻</button><button class="btn-blue" data-action="fan-action" data-kind="vote">事前打投</button><button class="btn-secondary" data-action="fan-action" data-kind="fund">回归集资</button><button class="btn-pink" data-action="fan-action" data-kind="support">生日/地铁应援</button></div><div class="button-row"><button class="btn-secondary" data-action="generate-letter">收到一封粉丝来信</button><button class="btn-secondary" data-action="open-chat" data-chat-id="fanrep">和粉丝代表聊天</button><button class="btn-danger" data-action="new-issue" data-issue-type="态度争议">模拟态度争议</button></div></div><div class="card"><h3 class="tg">关系与对话</h3><p class="tiny muted">这里是 K-POP 版本的独有层：关系、信任和情感价值会影响粉圈动员与团队适配。连接 API 后，回复会根据角色人设和近期事件动态生成。</p>${relations}</div><div class="card"><h3 class="tg">舆论与公关</h3>${issues||'<div class="empty">目前没有待处理争议。</div>'}</div>`;}
function renderCompany(){const c=state.agency.contract;const roles=['singer','producer','actor'];document.getElementById('page-company').innerHTML=`<div class="section-title"><h2>🏢 公司与多栖路线</h2><span class="badge">玩家是艺人，不经营公司</span></div><div class="card"><h3 class="tg">${esc(state.agency.name)}</h3><div class="metric-line"><span>公司类型</span><b>${esc(state.agency.tier)}</b></div><div class="metric-line"><span>资源系数 / 艺人分成</span><b>×${state.agency.resource.toFixed(2)} / ${Math.round((c.status==='active'?state.agency.split:.88)*100)}%</b></div><div class="metric-line"><span>合约状态</span><b>${c.status==='active'?`到 ${c.endYear} 年`:'已到期/自由谈判'}</b></div><p class="tiny muted">合约内公司负责资源和行程审批；合约到期后，你可以续约、换公司或成为自由艺人。不会因为转型而删除你的爱豆履历。</p>${c.status==='expired'?'<div class="button-row"><button data-action="renew">续约</button><button class="btn-blue" data-action="change-agency">转入新公司</button><button class="btn-secondary" data-action="leave-agency">成为自由艺人</button></div>':c.status==='free'?'<div class="button-row"><button class="btn-blue" data-action="change-agency">寻找新公司 / 签新约</button></div>':''}</div><div class="card"><h3 class="tg">主副职业</h3>${state.player.activeRoles.map(r=>`<div class="role-card" style="margin:6px 0"><span><b>${ROLE_LABELS[r]}</b>${state.player.primaryRole===r?' <span class="badge pink">当前主线</span>':''}</span><button class="btn-small btn-secondary" data-action="primary-role" data-role="${r}">设为主线</button></div>`).join('')}<div class="button-row">${roles.filter(r=>!state.player.activeRoles.includes(r)).map(r=>`<button class="btn-secondary" data-action="request-role" data-role="${r}">解锁${ROLE_LABELS[r]}</button>`).join('')}</div><p class="tiny muted">解锁条件：Solo 需要已发行作品；制作人需要创作能力与署名；演员需要演技或公众好感。合约权限和经纪人信任会影响审批。</p></div><div class="card"><h3 class="tg">资源与沟通</h3><div class="metric-line"><span>制作团队能力</span><b>${Math.round(state.agency.producer)}</b></div><div class="metric-line"><span>经纪团队能力</span><b>${Math.round(state.agency.manager)}</b></div><div class="metric-line"><span>公司自由度</span><b>${Math.round(state.agency.freedom)}</b></div><div class="button-row"><button class="btn-secondary" data-action="open-chat" data-chat-id="manager">和经纪人谈安排</button><button class="btn-secondary" data-action="open-chat" data-chat-id="producer">和制作人谈歌</button></div></div>`;}

quality||0)+'</span></div>').join(''):'<div class="empty">曲库还没有成品。先在“创作新曲”创建 Demo，再去录音室。</div>')+'</div>';}else if(sub==='acting'){body='<div class="card"><h3 class="tg">演戏企划</h3><p class="tiny muted">演技路线、OST、网剧和电影邀约会沿用同一套周行动与多栖负载。</p><div class="button-row"><button data-action="actor-job">接受一次试镜/拍摄</button><button class="btn-secondary" data-action="open-chat" data-chat-id="manager">和经纪人谈演戏安排</button></div></div>';}else{body='<div id="projectComebackHost"></div>';host.innerHTML=tabs+body;const target=document.getElementById('projectComebackHost');if(target){const source=document.getElementById('page-comeback');if(source&&source.innerHTML)target.innerHTML=source.innerHTML;else target.innerHTML='<div class="card"><div class="empty">回归企划正在加载。</div></div>';}}if(sub!=='comeback')host.innerHTML=tabs+body;}

function exportSave(){if(!state)return;const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${state.player.stageName}-kpop-save.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);notify('已导出 JSON 存档。');}
function importSave(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=normalizeState(JSON.parse(reader.result));saveGame(true);enterGame();renderAll();notify('JSON 存档导入成功。');}catch(e){notify('导入失败：文件不是有效的模拟器存档。');}};reader.readAsText(file);}

      if(ok){a.lastYear=year;state.awards.unshift({id:uid('award'),year:year,name:a.name,work:work});logEvent(year+' 年赛季：达成自定义奖项「'+a.name+'」。','good');}});};
  /* 系统工具卡片（追加在设置弹窗末尾） */
  window.kairosSystemCards=function(){
    if(!state)return'';
    ensureCustom();
    const C=window.kairosSysCard;
    let h='';
    h+=C('clean','🧹 数据瘦身（防爆档清理）','<p class="tiny muted">原版同款：清理一年前的旧数据，防止存档膨胀、结算变慢。</p><div class="button-row"><button class="btn-secondary" data-action="sys-clean-npc-songs">清理一年前的 NPC 歌曲</button><button class="btn-secondary" data-action="sys-clean-my-sides">删我的一年前的【非主打】</button><button class="btn-secondary" data-action="sys-clean-my-main">删我的一年前的【主打】</button></div>');
    h+=C('time','⏰ 系统时间管理','<p class="tiny muted">强制修改当前时间（每月 4 周，周次 1–4），存档与榜单周数会同步换算。</p><div class="settings-row"><span>年</span><input id="sysTimeY" type="number" value="'+state.time.y+'" style="width:80px"></div><div class="settings-row"><span>月</span><input id="sysTimeM" type="number" min="1" max="12" value="'+state.time.m+'" style="width:80px"></div><div class="settings-row"><span>周次</span><input id="sysTimeW" type="number" min="1" max="4" value="'+state.time.w+'" style="width:80px"></div><button class="btn-secondary" data-action="sys-set-time">强制修改时间</button>');
    let slots='';for(let n=1;n<=5;n++){slots+='<div class="settings-row"><span>槽位 '+n+'</span><span class="button-row"><button class="btn-small btn-secondary" data-action="sys-slot-save" data-slot="'+n+'">保存</button><button class="btn-small btn-secondary" data-action="sys-slot-load" data-slot="'+n+'">读取</button><button class="btn-small btn-danger" data-action="sys-slot-del" data-slot="'+n+'">删除</button></span></div>';}
    h+=C('slots','💾 存档槽位（1–5）','<p class="tiny muted">独立于自动存档的手动槽位；读取槽位会覆盖当前生涯（覆盖前会先自动保存一次）。</p>'+slots);
    h+=C('fixcharts','🔧 强制修正 / 刷新榜单数据','<p class="tiny muted">遇到榜单空白、Peak 异常时点击：重建全部歌曲的榜单结构并按本周数据重算一次。</p><button class="btn-secondary" data-action="sys-refresh-charts">强制刷新榜单数据</button>');
    const rate=Number(state.npcComebackRate||0.35);
    const rateSel='<select id="sysComebackRate" style="width:150px"><option value="0.15" '+(rate<=0.2?'selected':'')+'>低频（冷门期）</option><option value="0.35" '+(rate>0.2&&rate<0.5?'selected':'')+'>标准（原版节奏）</option><option value="0.6" '+(rate>=0.5?'selected':'')+'>高频（神仙打架）</option></select>';
    h+=C('rules','🌐 宇宙规则（NPC 行为）','<div class="settings-row"><span>团体出团频率（NPC 回归发歌概率）</span>'+rateSel+'</div><button class="btn-secondary" data-action="sys-save-comeback">保存出团频率</button>');
    const ca=(state.npcArtists||[]).filter(a=>a.custom);
    h+=C('inject','🧬 注入自定义艺人到大盘','<p class="tiny muted">原版「单体注入大盘」：注入后立即进入艺人榜与全部音源榜，参与每周生态演化。</p><label class="label">艺人名</label><input id="customArtistName" placeholder="例如：STELLARIS"><label class="label">类型</label><select id="customArtistType" style="width:130px"><option value="group">团体</option><option value="solo">solo</option></select><label class="label">初始粉丝数</label><input id="customArtistFans" type="number" min="0" value="500000"><label class="label">所属公司（可选）</label><input id="customArtistCompany" placeholder="例如：KAIROS 娱乐"><label class="label"><input type="checkbox" id="customArtistSong" checked> 同时注入一首代表作品</label><div class="button-row"><button data-action="custom-inject-artist">注入大盘</button></div>'+(ca.length?'<p class="tiny muted">已注入：'+ca.map(a=>esc(a.name)+'（'+fmt(a.fans)+' 粉'+(a.company?' · '+esc(a.company):'')+'）').join('、')+'</p>':''));
    h+=C('charts','📊 自定义榜单','<p class="tiny muted">原版「自定义榜单」：按占全球大盘比例折算分数；保存后手机桌面会出现独立的榜单 App。</p><label class="label">榜单名称</label><input id="customChartName" placeholder="例如：江南音源榜"><label class="label">约占全球大盘比例（%）</label><input id="customChartShare" type="number" min="1" max="100" value="30"><div class="button-row"><button data-action="custom-add-chart">添加榜单</button></div>'+(state.customCharts.length?state.customCharts.map(c=>'<div class="list-item"><b>'+esc(c.name)+'</b><br><span class="tiny muted">约占全球大盘 '+c.share+'%</span><button class="btn-small btn-danger" data-action="custom-del-chart" data-id="'+c.id+'">删除</button></div>').join(''):''));
    h+=C('cfg','📦 自定义配置导入 / 导出','<p class="tiny muted">只迁移自定义榜单、自定义奖项与注入艺人，不包含游戏存档。</p><div class="button-row"><button class="btn-secondary" data-action="custom-export">导出自定义配置</button><button class="btn-secondary" data-action="custom-import-trigger">导入自定义配置</button></div><input id="customImportFile" type="file" accept="application/json,.json" class="hidden"></div>');
    return h;};
  /* 系统页面卡片：三角形收放（状态记忆在 state.ui.sysOpen，切换为原地操作不重渲染） */
  window.kairosSysCard=function(key,title,body){
    state.ui=state.ui||{};state.ui.sysOpen=state.ui.sysOpen||{};
    const open=!!state.ui.sysOpen[key];
    return '<div class="card"><div data-action="sys-card-toggle" data-key="'+key+'" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px"><span data-sys-arrow="'+key+'">'+(open?'▼':'▶')+'</span><b style="margin:0">'+title+'</b></div><div class="sys-body'+(open?'':' hidden')+'" id="sysBody_'+key+'" style="margin-top:8px">'+body+'</div></div>';};
  /* 奖项殿堂：可折叠的奖项自定义编辑器（三角形收放） */
  let awCustomOpen=false;
  window.kairosAwardsCustomHtml=function(){
    if(!state)return'';
    ensureCustom();
    const metLabel={song:'主打歌累计流媒',fans:'总粉丝数',public:'公众好感'};
    const body='<p class="tiny muted">年末赛季结算时检查；达标自动颁发并写进奖项履历（每年最多一次）。</p><label class="label">奖项名称</label><input id="customAwardName" placeholder="例如：金唱片数字音源本赏"><label class="label">达标条件</label><select id="customAwardMetric" style="width:200px"><option value="song">主打歌累计流媒</option><option value="fans">总粉丝数</option><option value="public">公众好感</option></select><label class="label">阈值</label><input id="customAwardThreshold" type="number" min="0" value="3000000"><div class="button-row"><button data-action="custom-add-award">添加奖项</button></div>'+(state.customAwards.length?state.customAwards.map(a=>'<div class="list-item"><b>'+esc(a.name)+'</b><br><span class="tiny muted">'+(metLabel[a.metric]||a.metric)+' ≥ '+fmt(a.threshold)+(a.lastYear?' · 已于 '+a.lastYear+' 年获得':'')+'</span><button class="btn-small btn-danger" data-action="custom-del-award" data-id="'+a.id+'">删除</button></div>').join(''):'<div class="empty">还没有自定义奖项，点上方三角形展开添加。</div>');
    return '<div class="card"><div data-action="awards-custom-toggle" style="cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px"><span id="awardsCustomArrow">'+(awCustomOpen?'▼':'▶')+'</span><b>奖项自定义</b><span class="tiny muted">点击三角展开 / 收起</span></div><div id="awardsCustomBody"'+(awCustomOpen?'':' class="hidden"')+' style="margin-top:8px">'+body+'</div></div>';};
  /* 动作分发 */
  window.kairosSystemAction=async function(action,el){
    if(!state)return;
    ensureCustom();
    const ds=el&&el.dataset||{};
    const refresh=()=>{saveGame(true);if(typeof renderSettings==='function')renderSettings();openSystemPanel();};
    try{
      if(action==='sys-card-toggle'){
        const key=el.dataset.key;
        state.ui=state.ui||{};state.ui.sysOpen=state.ui.sysOpen||{};
        state.ui.sysOpen[key]=!state.ui.sysOpen[key];
        saveGame(true);
        document.querySelectorAll('[id="sysBody_'+key+'"]').forEach(b=>b.classList.toggle('hidden',!state.ui.sysOpen[key]));
        document.querySelectorAll('[data-sys-arrow="'+key+'"]').forEach(a=>a.textContent=state.ui.sysOpen[key]?'▼':'▶');
        return;}
      if(action==='awards-custom-toggle'){
        awCustomOpen=!awCustomOpen;
        const body=document.querySelector('#modalBox #awardsCustomBody');
        const arr=document.querySelector('#modalBox #awardsCustomArrow');
        if(body)body.classList.toggle('hidden',!awCustomOpen);
        if(arr)arr.textContent=awCustomOpen?'▼':'▶';
        return;}
      if(action==='sys-clean-npc-songs'){
        const before=(state.npcSongs||[]).length;
        state.npcSongs=(state.npcSongs||[]).filter(sn=>(sn.weeks||0)<=52);
        notify('已清理一年前的 NPC 旧歌 '+Math.max(0,before-state.npcSongs.length)+' 首。');refresh();return;}
      if(action==='sys-clean-my-sides'||action==='sys-clean-my-main'){
        const main=getMainSong();const before=state.songs.length;
        state.songs=state.songs.filter(sn=>{
          if(!(sn.released&&(sn.weeks||0)>52))return true;
          if(action==='sys-clean-my-sides')return main&&sn.id===main.id;
          return false;});
        notify('已删除一年前的旧作品 '+Math.max(0,before-state.songs.length)+' 首。');refresh();return;}
      if(action==='sys-set-time'){
        const y=modalNum('sysTimeY',state.time.y),m=clamp(modalNum('sysTimeM',state.time.m),1,12),w=clamp(modalNum('sysTimeW',state.time.w),1,4);
        state.time.y=y;state.time.m=m;state.time.w=w;
        state.week.index=Math.max(1,(y-2026)*48+(m-1)*4+w);
        logEvent('系统时间被强制修改为 '+y+' 年 '+m+' 月第 '+w+' 周。','warn');
        notify('时间已修改为 '+y+' 年 '+m+' 月第 '+w+' 周。');refresh();if(typeof renderAll==='function')renderAll();return;}
      if(action==='sys-slot-save'){
        const n=String(ds.slot||1);
        try{localStorage.setItem(STORAGE_KEY+'_slot'+n,JSON.stringify(state));notify('已保存到槽位 '+n+'。');}catch(e){notify('槽位保存失败：'+e.message);}
        return;}
      if(action==='sys-slot-load'){
        const n=String(ds.slot||1);
        const raw=localStorage.getItem(STORAGE_KEY+'_slot'+n);
        if(!raw){notify('槽位 '+n+' 是空的。');return;}
        if(!confirm('读取槽位 '+n+' 会覆盖当前生涯（当前进度会先自动保存）。继续？'))return;
        saveGame(true);
        state=normalizeState(JSON.parse(raw));currentTab='profile';closeModal();enterGame();renderAll();notify('已读取槽位 '+n+'。');return;}
      if(action==='sys-slot-del'){
        const n=String(ds.slot||1);
        if(!confirm('确定删除槽位 '+n+'？'))return;
        localStorage.removeItem(STORAGE_KEY+'_slot'+n);notify('槽位 '+n+' 已删除。');return;}
      if(action==='sys-refresh-charts'){
        ensureKairosCharts();state.songs.forEach(ensureSongCharts);(state.npcSongs||[]).forEach(ensureSongCharts);
        if(typeof window.updateKairosPlatformCharts==='function')window.updateKairosPlatformCharts();
        renderAll();notify('榜单数据已强制刷新。');return;}
      if(action==='sys-save-comeback'){
        const v=Number(modalVal('sysComebackRate')||0.35);
        state.npcComebackRate=[0.15,0.35,0.6].includes(v)?v:0.35;
        notify('团体出团频率已保存。');refresh();return;}
      if(action==='sys-test-api'){
        const cfg=apiConfigValues('settings');
        if(!cfg.endpoint){notify('请先填写 API Endpoint。');return;}
        if(!cfg.token){notify('请先填写 API Key。');return;}
        const base=cfg.endpoint.replace(/\/$/,'');
        notify('正在测试连接……');
        try{
          const r=await fetch(base+(cfg.path||'/chat/completions'),{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.token},body:JSON.stringify({model:(cfg.modelInput&&cfg.modelInput.value)||'gpt-4o-mini',messages:[{role:'user',content:'ping'}],max_tokens:1})});
          notify(r.ok?'🔌 连接成功（HTTP '+r.status+'）。':'🔌 连接失败：HTTP '+r.status);
        }catch(e){notify('🔌 连接失败：'+e.message);}
        return;}
      if(action==='sys-exit-menu'){
        if(!confirm('退出到主菜单？（当前进度会自动保存）'))return;
        saveGame(true);closeModal();if(typeof exitGame==='function')exitGame();return;}
      if(action==='custom-inject-artist'){
        const name=modalVal('customArtistName');
        if(!name){notify('请填写艺人名。');return;}
        if(!Array.isArray(state.npcArtists))state.npcArtists=[];
        if(state.npcArtists.some(a=>a.name===name)){notify('大盘里已经有同名艺人了。');return;}
        const type=(document.querySelector('#modalBox #customArtistType')||document.getElementById('customArtistType')||{}).value||'group';
        const fans=Math.max(0,modalNum('customArtistFans',500000));
        const company=modalVal('customArtistCompany');
        const withSong=!!((document.querySelector('#modalBox #customArtistSong')||document.getElementById('customArtistSong')||{}).checked);
        const artist={id:uid('npa'),name:name,type:type,fans:fans,company:company,custom:true,debutYear:state.time.y};
        state.npcArtists.push(artist);
        if(withSong)state.npcSongs.push(makeLocalNpcSong(artist));
        logEvent('自定义艺人「'+name+'」注入大盘。','good');
        notify('「'+name+'」已注入大盘，去艺人榜看看吧。');refresh();return;}
      if(action==='custom-add-chart'){
        const name=modalVal('customChartName');
        if(!name){notify('请填写榜单名称。');return;}
        if(state.customCharts.some(c=>c.name===name)){notify('已经有同名榜单了。');return;}
        const share=clamp(modalNum('customChartShare',30),1,100);
        state.customCharts.push({id:uid('cx'),name:name,share:share});
        notify('自定义榜单「'+name+'」已添加，手机桌面出现新 App。');refresh();return;}
      if(action==='custom-del-chart'){
        const c=state.customCharts.find(x=>x.id===ds.id);
        state.customCharts=state.customCharts.filter(x=>x.id!==ds.id);
        mergedSongs().forEach(sn=>{if(sn.charts&&c)delete sn.charts[c.id];});
        if(state.ui&&state.ui.phoneApp&&c&&state.ui.phoneApp==='CX_'+c.id)state.ui.phoneApp='home';
        notify('榜单已删除。');refresh();if(typeof renderAll==='function')renderAll();return;}
      if(action==='custom-add-award'){
        const name=modalVal('customAwardName');
        if(!name){notify('请填写奖项名称。');return;}
        if(state.customAwards.some(a=>a.name===name)){notify('已经有同名奖项了。');return;}
        const metric=(document.querySelector('#modalBox #customAwardMetric')||document.getElementById('customAwardMetric')||{}).value||'song';
        const threshold=Math.max(0,modalNum('customAwardThreshold',3000000));
        state.customAwards.push({id:uid('aw'),name:name,metric:metric,threshold:threshold,lastYear:0});
        notify('自定义奖项「'+name+'」已添加。');saveGame(true);if(typeof renderSettings==='function')renderSettings();if(document.querySelector('#modalBox #awardsCustomBody')&&typeof mapAwardSummary==='function'){mapAwardSummary();}else if(typeof openSystemPanel==='function'){openSystemPanel();}return;}
      if(action==='custom-del-award'){
        state.customAwards=state.customAwards.filter(x=>x.id!==ds.id);
        notify('自定义奖项已删除。');saveGame(true);if(typeof renderSettings==='function')renderSettings();if(document.querySelector('#modalBox #awardsCustomBody')&&typeof mapAwardSummary==='function'){mapAwardSummary();}else if(typeof openSystemPanel==='function'){openSystemPanel();}return;}
      if(action==='custom-export'){
        const data={kind:'kairos-custom-config',version:1,charts:state.customCharts,awards:state.customAwards.map(a=>({name:a.name,metric:a.metric,threshold:a.threshold})),artists:(state.npcArtists||[]).filter(a=>a.custom)};
        const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kairos-custom-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
        notify('自定义配置已导出。');return;}
      if(action==='custom-import-trigger'){
        const f=document.querySelector('#modalBox #customImportFile')||document.getElementById('customImportFile');
        if(f)f.click();return;}
      if(action==='custom-import-file'){
        const input=el&&el.target;const file=input&&input.files&&input.files[0];
        if(!file){notify('没有选择文件。');return;}
        const reader=new FileReader();
        reader.onload=()=>{try{
          const d=JSON.parse(reader.result);
          if(!d||d.kind!=='kairos-custom-config')throw new Error('不是自定义配置文件');
          if(Array.isArray(d.charts))d.charts.forEach(c=>{if(c&&c.name&&!state.customCharts.some(x=>x.name===c.name))state.customCharts.push({id:uid('cx'),name:String(c.name),share:clamp(Number(c.share)||30,1,100)});});
          if(Array.isArray(d.awards))d.awards.forEach(a=>{if(a&&a.name&&!state.customAwards.some(x=>x.name===a.name))state.customAwards.push({id:uid('aw'),name:String(a.name),metric:a.metric||'song',threshold:Number(a.threshold)||0,lastYear:0});});
          if(Array.isArray(d.artists))d.artists.forEach(a=>{if(a&&a.name&&!state.npcArtists.some(x=>x.name===a.name)){const na={id:uid('npa'),name:String(a.name),type:a.type||'group',fans:Math.max(0,Number(a.fans)||0),company:a.company||'',custom:true,debutYear:a.debutYear||state.time.y};state.npcArtists.push(na);state.npcSongs.push(makeLocalNpcSong(na));}});
          saveGame(true);renderAll();notify('自定义配置导入成功：榜单 '+state.customCharts.length+'、奖项 '+state.customAwards.length+'。');
        }catch(e){notify('导入失败：'+e.message);}};
        reader.readAsText(file);return;}
      notify('未知系统操作：'+action);
    }catch(e){notify('系统操作失败：'+e.message);}
  };
})();

</script>
